<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zoo-Runner</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
  <style> body { margin: 0; background: #000; overflow: hidden; } </style>
</head>
<body>
<script>
let player;
let fundoDia, fundoTarde, fundoNoite;
let somPulo, somPuloEspecial, somFundo, somSelect, somOk, somInicio, somVitoria;
let jogoRodando = false;
let personagemEscolhido = "raposa";
let distancia = 0;
let textoDistancia;
let venceu = false;
let velocidadeJogo = 5;

const LARGURA = 1692;
const ALTURA = 941;

const config = {
  type: Phaser.CANVAS,
  width: LARGURA,
  height: ALTURA,
  pixelArt: true,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  physics: {
    default: "arcade",
    arcade: { gravity: { y: 2200 } }
  },
  scene: { preload, create, update }
};

const game = new Phaser.Game(config);

function preload() {
  this.load.image("start", "start.png");
  this.load.image("selecao_personagem", "selecao_personagem.png");
  this.load.image("dia", "corrida.png");
  this.load.image("tarde", "corrida_3.png");
  this.load.image("noite", "corrida_5.png");

  const configSprite = { frameWidth: 75, frameHeight: 99 };
  this.load.spritesheet("raposa", "raposa.png", configSprite);
  this.load.spritesheet("unicornio", "unicornio.png", configSprite);
  this.load.spritesheet("leopardo", "leopardo.png", configSprite);
  this.load.spritesheet("foca", "foca.png", configSprite);

  this.load.audio("musica_inicio", "song.mp3");
  this.load.audio("pulo", "jump.mp3");
  this.load.audio("pulo_especial", "jump_special.mp3");
  this.load.audio("musica_jogo", "fundo.mp3");
  this.load.audio("select", "select.mp3");
  this.load.audio("ok", "ok.mp3");
  this.load.audio("sukuna_happy", "sukuna_happy.mp3");
}

function create() {
  const w = LARGURA; const h = ALTURA;

  try {
      somInicio = this.sound.add("musica_inicio", { loop: true, volume: 0.1 });
      somPulo = this.sound.add("pulo");
      somPuloEspecial = this.sound.add("pulo_especial");
      somFundo = this.sound.add("musica_jogo", { loop: true, volume: 0.5 });
      somSelect = this.sound.add("select");
      somOk = this.sound.add("ok");
      somVitoria = this.sound.add("sukuna_happy");
  } catch (e) {}

  fundoDia = this.add.tileSprite(0, 0, w, h, "dia").setOrigin(0, 0).setVisible(false);
  fundoTarde = this.add.tileSprite(0, 0, w, h, "tarde").setOrigin(0, 0).setVisible(false).setAlpha(0);
  fundoNoite = this.add.tileSprite(0, 0, w, h, "noite").setOrigin(0, 0).setVisible(false).setAlpha(0);

  let ground = this.add.rectangle(w/2, h - 150, w, 40, 0x000000, 0);
  this.physics.add.existing(ground, true);

  player = this.physics.add.sprite(300, h - 300, "raposa").setVisible(false);
  player.setDisplaySize(190, 190);
  player.setCollideWorldBounds(true);
  this.physics.add.collider(player, ground);

  ["raposa", "unicornio", "leopardo", "foca"].forEach(key => {
      this.anims.create({
        key: "run_" + key,
        frames: this.anims.generateFrameNumbers(key, { start: 0, end: 4 }),
        frameRate: (key === "leopardo") ? 16 : 10,
        repeat: -1
      });
      this.anims.create({
        key: "jump_" + key,
        frames: this.anims.generateFrameNumbers(key, { start: 5, end: 10 }),
        frameRate: 8,
        repeat: 0
      });
  });

  textoDistancia = this.add.text(50, 50, '0m', {
      fontSize: '48px', fill: '#fff', stroke: '#000', strokeThickness: 6
  }).setScrollFactor(0).setDepth(30).setVisible(false);

  let telaSelecao = this.add.container(0, 0).setVisible(false).setDepth(10);
  let bgSel = this.add.image(w/2, h/2, "selecao_personagem").setDisplaySize(w, h);

  let btnRaposa = this.add.rectangle(610, 360, 350, 350, 0xffffff, 0).setInteractive();
  let btnFoca = this.add.rectangle(1080, 360, 350, 350, 0xffffff, 0).setInteractive();
  let btnUnicornio = this.add.rectangle(610, 680, 350, 350, 0xffffff, 0).setInteractive();
  let btnLeopardo = this.add.rectangle(1080, 680, 350, 350, 0xffffff, 0).setInteractive();
  let btnJogar = this.add.rectangle(w/2, 900, 450, 100, 0xffffff, 0).setInteractive();

  telaSelecao.add([bgSel, btnRaposa, btnFoca, btnUnicornio, btnLeopardo, btnJogar]);

  let telaStart = this.add.image(w/2, h/2, "start").setDisplaySize(w, h).setInteractive().setDepth(20);

  telaStart.on('pointerdown', () => {
      if (somInicio && !somInicio.isPlaying) somInicio.play();
      this.tweens.add({ targets: telaStart, alpha: 0, duration: 400, onComplete: () => {
          telaStart.setVisible(false);
          telaSelecao.setVisible(true);
      }});
  });

  btnRaposa.on('pointerdown', () => { personagemEscolhido = "raposa"; if (somSelect) somSelect.play(); });
  btnFoca.on('pointerdown', () => { personagemEscolhido = "foca"; if (somSelect) somSelect.play(); });
  btnUnicornio.on('pointerdown', () => { personagemEscolhido = "unicornio"; if (somSelect) somSelect.play(); });
  btnLeopardo.on('pointerdown', () => { personagemEscolhido = "leopardo"; if (somSelect) somSelect.play(); });

  btnJogar.on('pointerdown', () => {
      if (somOk) somOk.play();
      this.cameras.main.fadeOut(500, 0, 0, 0);
      this.cameras.main.once('camerafadeoutcomplete', () => {
          if (somInicio) somInicio.stop();
          telaSelecao.setVisible(false);
          iniciarPartida();
          this.cameras.main.fadeIn(500, 0, 0, 0);
      });
  });

  const iniciarPartida = () => {
      jogoRodando = true;
      venceu = false;
      distancia = 0;
      fundoDia.setVisible(true); fundoTarde.setVisible(true); fundoNoite.setVisible(true);
      player.setVisible(true).setTexture(personagemEscolhido);

      if (personagemEscolhido === "leopardo") {
          velocidadeJogo = 13;
          player.setTint(0xdddddd);
      } else {
          velocidadeJogo = 5;
          player.clearTint();
      }

      player.play("run_" + personagemEscolhido);
      textoDistancia.setVisible(true);
      if (somFundo) somFundo.play();
  };

  this.input.on('pointerdown', () => {
    if (jogoRodando && !venceu && (player.body.touching.down || player.body.blocked.down)) {
        player.setVelocityY(-1050);
        player.play("jump_" + personagemEscolhido);
        if (personagemEscolhido === "leopardo") {
            if (somPuloEspecial) somPuloEspecial.play();
        } else {
            if (somPulo) somPulo.play();
        }
    }
  });
}

function update() {
  if (!jogoRodando || venceu) return;

  fundoDia.tilePositionX += velocidadeJogo;
  fundoTarde.tilePositionX += velocidadeJogo;
  fundoNoite.tilePositionX += velocidadeJogo;

  distancia += (velocidadeJogo / 33);
  let metros = Math.floor(distancia);
  textoDistancia.setText(metros + 'm');

  if (metros >= 80 && metros <= 120) fundoTarde.setAlpha((metros - 80) / 40);
  if (metros >= 180 && metros <= 220) fundoNoite.setAlpha((metros - 180) / 40);

  if ((player.body.touching.down || player.body.blocked.down) &&
      player.anims.currentAnim && player.anims.currentAnim.key.includes("jump")) {
      player.play("run_" + personagemEscolhido, true);
  }

  // LÓGICA DE VITÓRIA COM SOM AUTOMÁTICO
  if (distancia >= 300 && !venceu) {
      venceu = true;
      if (somFundo) somFundo.stop();
      if (somVitoria) somVitoria.play(); // Toca o sukuna_happy.mp3
      player.setVelocityX(450);
  }
}
</script>
</body>
</html>
